# Terrain puddle reference settings for the VC integration.
# These six values also belong in every weather preset, including dry weather.
# Matching values keep the ground shape fixed while retained water dries.
rtx.wetness.puddleCellSize = 2.8
rtx.wetness.puddleCoverage = 0.7
rtx.wetness.puddleMicroAmplitude = 0.03
rtx.wetness.puddleAlbedoDarken = 0.25
rtx.wetness.puddleWaveStrength = 0.08
rtx.wetness.puddleWaveScale = 1

# Add the remaining settings to the game's rtx.conf.
rtx.wetness.rainMapEnabled = True
rtx.wetness.rainMapResolution = 512
rtx.wetness.rainMapExtent = 128
rtx.wetness.rainMapTraceAbove = 100
rtx.wetness.rainMapTraceBelow = 60
rtx.wetness.rainOcclusionMinHeight = 2.5
rtx.wetness.rainOcclusionFeather = 1.5
rtx.wetness.surfaceRetentionEnabled = True
rtx.wetness.surfaceHoldSeconds = 90
rtx.wetness.surfaceDrySeconds = 120
rtx.wetness.puddleDepressionWeight = 0.3
rtx.wetness.puddleSlopeLimit = 0.053
rtx.wetness.puddleSlopeFeather = 2.4
rtx.wetness.puddleEdgeWidth = 0.025
rtx.wetness.puddleShoreWidth = 0.02
rtx.wetness.puddleShoreDarkening = 0.8
rtx.wetness.puddleRoughness = 0.035
rtx.wetness.puddleOcclusion = 0.5
rtx.wetness.puddleDetailDistance = 400
